# Hugo configuration file
title: Irbis Documentation
baseURL: https://docs.irbis.sh/

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - identifier: more
      name: More
      weight: 2
    - name: About
      pageRef: /about
      parent: more
    - name: Code of Conduct
      pageRef: /code-of-conduct
      parent: more
    - name: Contact ↗
      url: "mailto:contact@irbis.sh"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/irbis-sh"
      params:
        icon: github
    - name: Mastodon
      weight: 6
      url: "https://mastodon.social/@irbis_sh"
      params:
        icon: mastodon
    - name: Bluesky
      weight: 7
      url: "https://bsky.app/profile/irbis.sh"
      params:
        icon: bluesky
    - name: Discord
      weight: 8
      url: "https://discord.gg/jSzEwby7JY"
      params:
        icon: discord

params:
  description: Documentation for Irbis projects, starting with Zen, the open-source ad-blocker for Windows, macOS and Linux.
  # Open Graph image for pages that don't set their own `images`.
  images:
    - /images/og-irbis.jpg

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo-black.svg
      dark: images/logo-white.svg
      link: /
      width: 82
      height: 24

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/irbis-sh/zen-docs/edit/master/content"

  imageZoom:
    enable: true

enableRobotsTXT: true

# No pages use tags or categories, so their empty list pages only add noise
# to the sitemap.
disableKinds:
  - taxonomy
  - term
